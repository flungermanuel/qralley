name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qurally
          POSTGRES_PASSWORD: qurally_dev
          POSTGRES_DB: qurally
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U qurally"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:layers
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm route:validate
      - run: pnpm test
      - run: pnpm --filter @qurally/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
